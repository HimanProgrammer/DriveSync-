name: Build DriveSync (Windows)

on:
  push:
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/build-drivesync-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build per workflow at a time: a newer push cancels the older build,
# so two runs never update the same release together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DriveSync-windows.zip
      - name: Build the installer (DriveSync-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = "1.0.${{ github.run_number }}"
          & $iscc "/DAppVersion=$version" installer\drivesync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSync-windows
          path: |
            DriveSync-windows.zip
            dist/DriveSync-Setup.exe
      - name: Publish as a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drivesync-windows-latest
          name: DriveSync for Windows (latest)
          prerelease: true
          make_latest: false
          body: Built automatically from ${{ github.ref_name }} at ${{ github.sha }}.
          files: |
            DriveSync-windows.zip
            dist/DriveSync-Setup.exe
