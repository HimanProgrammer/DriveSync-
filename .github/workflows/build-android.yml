name: Build DriveSync (Android APK)

on:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk DriveSync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSync-android-apk
          path: DriveSync.apk
      - name: Publish as a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DriveSync for Android (latest)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Built automatically from ${{ github.ref_name }} at ${{ github.sha }}.
          files: DriveSync.apk
