name: Build DriveSync (Android APK)

on:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build per workflow at a time: a newer push cancels the older build,
# so two runs never update the same release together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Same signing key for every build, from repo secrets (see README).
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/drivesync-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=drivesync\nstoreFile=drivesync-release.jks\n' \
              "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary debug key."
          fi
      # Universal APK (all CPU types, big) plus a phone-only arm64 APK,
      # which is much smaller and downloads reliably on mobile data.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk DriveSync-universal.apk
      - run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DriveSync.apk
      - run: ls -la DriveSync.apk DriveSync-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSync-android-apk
          path: |
            DriveSync.apk
            DriveSync-universal.apk
      # Upload straight to the existing release (replacing old files). This
      # only uses the asset upload API, so it never edits or moves the tag.
      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-latest DriveSync.apk DriveSync-universal.apk --clobber --repo ${{ github.repository }}
