name: Build floating agent (Windows)

on:
  push:
    paths:
      - 'agent_app/**'
      - '.github/workflows/build-agent-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DriveSyncAgent-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSyncAgent-windows
          path: agent_app/DriveSyncAgent-windows.zip
      - name: Publish as a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-windows-latest
          name: DriveSync Agent for Windows (latest)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Built automatically from ${{ github.ref_name }} at ${{ github.sha }}.
          files: agent_app/DriveSyncAgent-windows.zip
